<!-- El SVG es vectorial, por eso la V conserva la nitidez en una pestaña pequeña. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Base de color carbón con esquinas suaves. -->
  <rect width="64" height="64" rx="9" fill="#181816"/>
  <!-- La V naranja usa un polígono. Cada pareja de números indica un punto x,y. -->
  <polygon points="10,16 21,16 27,39 43,16 55,16 30,50 22,50" fill="#ff6535"/>
  <!-- La raya crema evoca una marca sobre el asfalto. -->
  <path d="M39 49h13" stroke="#f5efe2" stroke-width="4"/>
</svg>
